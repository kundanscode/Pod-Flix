@if (isVisible()) {
<nav class="navbar" [ngClass]="{'scrolled': isScrolled(), 'hidden': isHidden()}">
    <div class="left-section">
        <div class="logo">PODFLIX</div>

        <!-- Desktop Links -->
        <div class="nav-links desktop-only">
            <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/browse" [queryParams]="{category: 'Technology'}" routerLinkActive="active">Technology</a>
            <a routerLink="/browse" [queryParams]="{category: 'Travel'}" routerLinkActive="active">Travel</a>
            <a routerLink="/browse" [queryParams]="{category: 'Finance'}" routerLinkActive="active">Finance</a>
            <a routerLink="/browse" [queryParams]="{category: 'Health'}" routerLinkActive="active">Health</a>
        </div>

        <!-- Mobile Breadcrumb/Menu -->
        <div class="mobile-browse" (click)="toggleMobileMenu()">
            <span>Browse</span>
            <span class="caret">▼</span>

            @if (isMobileMenuOpen()) {
            <div class="mobile-dropdown">
                <div class="arrow-up"></div>
                <a routerLink="/home">Home</a>
                <a routerLink="/browse" [queryParams]="{category: 'Tech'}">Technology</a>
                <a routerLink="/browse" [queryParams]="{category: 'Travel'}">Travel</a>
                <a routerLink="/browse" [queryParams]="{category: 'Finance'}">Finance</a>
                <a routerLink="/browse" [queryParams]="{category: 'Health'}">Health</a>
                <a routerLink="/my-list">My List</a>
            </div>
            }
        </div>
    </div>

    <div class="nav-actions">

        </div> -->

        <!-- <div class="nav-item">Children</div> -->
        <!-- <div class="nav-item"><i class="fas fa-bell"></i></div> -->

        <div class="profile-menu" (click)="toggleProfileMenu()">
            <img src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg"
                alt="User" />
            <span class="caret">▼</span>

            @if (isProfileMenuOpen()) {
            <div class="profile-dropdown">
                <div class="arrow-up"></div>
                <div class="profile-dropdown-item" (click)="logout()">
                    Sign out
                </div>
            </div>
            }
        </div>
    </div>
</nav>
